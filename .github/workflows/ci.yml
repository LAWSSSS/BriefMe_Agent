name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TENCENT_DOCS_AUTO_UPLOAD: "0"
      DEEPSEEK_API_KEY: "ci-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q app.py agent config tools tests

      - name: Lint critical Python errors
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 \
            --show-source --statistics

      - name: Import smoke test
        run: |
          python -c "import app; app.build_ui(); print('UI build OK')"

      - name: Run tests
        run: python -m pytest -q --import-mode=importlib
